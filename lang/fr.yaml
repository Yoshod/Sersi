# Sersi French Language File
# Use {variable_name} for variables that will be replaced in the code.

# --- Generic ---
"yes": "Oui"
"no": "Non"

module_disabled:
  title: "Module désactivé"
  description: "Le module {module_name} est actuellement désactivé. Veuillez l'activer pour utiliser cette commande."

# --- Core Cogs ---

# --- Moderation Cogs ---
moderation_roles:
  add:
    title: "Rôle ajouté"
    description: "{role_mention} a été ajouté en tant que rôle de modération."
    description_warning: "{role_mention} a été ajouté en tant que rôle de modération avec un niveau d'autorité {authority_level}. Il existe déjà un rôle avec le même niveau d'autorité, par conséquent ce rôle ne pourra pas émettre de commandes de modération ciblant des utilisateurs avec le même niveau d'autorité."
    already_exists_title: "Rôle déjà existant"
    already_exists_description: "{role_mention} est déjà un rôle de modération. Veuillez utiliser la commande d'édition pour modifier ses permissions ou la commande de suppression pour le retirer."
    fields:
      permissions:
        name: "Permissions"
        value: "Les permissions suivantes ont été définies pour ce rôle :"
      authority_level: "Niveau d'autorité"
      warn: "Peut avertir"
      timeout: "Peut mettre en pause"
      immediate_ban: "Peut bannir immédiatement"
      vote_ban: "Peut voter pour bannir"
      unban: "Peut débannir"
      reform: "Peut réformer"
      blacklist: "Peut mettre sur liste noire"
      kick: "Peut expulser"
      declare_raid: "Déclarer un raid"
      add_moderator: "Ajouter un modérateur"
      remove_moderator: "Retirer un modérateur"
      immune: "Est immunisé"
      edit_offences: "Peut modifier les infractions"
      edit_cases: "Peut modifier les cas"

  edit:
    no_changes:
      title: "Aucun changement effectué"
      description: "Aucun changement n'a été apporté au rôle."
    success:
      title: "Rôle modifié"
      description: "{role_mention} a été modifié."
    not_found:
      title: "Rôle introuvable"
      description: "{role_mention} n'est pas un rôle de modération. Veuillez utiliser la commande d'ajout."
  remove:
    success:
      title: "Rôle retiré"
      description: "{role_mention} a été retiré en tant que rôle de modération."
    not_found:
      title: "Rôle introuvable"
      description: "{role_mention} n'est pas un rôle de modération."

