# Sersi English Language File
# Use {variable_name} for variables that will be replaced in the code.

# --- Generic ---
"yes": "Yes"
"no": "No"

module_disabled:
  title: "Module Disabled"
  description: "The {module_name} module is currently disabled. Please enable it to use this command."

# --- Core Cogs ---
setup:
  finish:
    success: "Setup has been completed. You can edit the modules and language at any time using the configure command."


# --- Moderation Cogs ---
moderation_roles:
  add:
    title: "Role added"
    description: "{role_mention} has been added as a moderation role."
    description_warning: "{role_mention} has been added as a moderation role with authority level {authority_level}. There is already a role with the same authority level, as such this role will not be able to issue moderation commands targeting users with the same authority level."
    already_exists_title: "Role already exists"
    already_exists_description: "{role_mention} is already a moderation role. Please use the edit command to modify its permissions or the remove command to remove it."
    fields:
      permissions:
        name: "Permissions"
        value: "The following permissions have been set for this role:"
      authority_level: "Authority Level"
      warn: "Can Warn"
      timeout: "Can Timeout"
      immediate_ban: "Can Immediate Ban"
      vote_ban: "Can Vote Ban"
      unban: "Can Unban"
      reform: "Can Reform"
      blacklist: "Can Blacklist"
      kick: "Can Kick"
      declare_raid: "Declare Raid"
      add_moderator: "Add Moderator"
      remove_moderator: "Remove Moderator"
      immune: "Is Immune"
      edit_offences: "Can Edit Offences"
      edit_cases: "Can Edit Cases"

  edit:
    no_changes:
      title: "No changes made"
      description: "No changes were made to the role."
    success:
      title: "Role edited"
      description: "{role_mention} has been edited."
    not_found:
      title: "Role not found"
      description: "{role_mention} is not a moderation role. Please use the add command."
  remove:
    success:
      title: "Role removed"
      description: "{role_mention} has been removed as a moderation role."
    not_found:
      title: "Role not found"
      description: "{role_mention} is not a moderation role."

# --- Logging Cogs/Utils ---
logging:
  setup:
    express:
      forbidden: "Sersi does not have permission to create channels or categories in this guild. Please check the permissions and try again."
      http_exception: "An HTTP error occurred while trying to create the logging category. Please try again later."
      global_logs: "sersi-logs"
      public_logs: "public-modlogs"
      tamper_logs: "tamper-logs"
      mod_logs: "mod-logs"
      guild_logs: "guild-logs"
      channel_logs: "channel-logs"
      role_logs: "role-logs"
      join_leave_logs: "join-leave-logs"
      voice_logs: "voice-logs"
      user_logs: "user-logs"
      deleted_message_logs: "deleted-messages"
      deleted_image_logs: "deleted-images"
      edited_message_logs: "edited-messages"
      success: "Logging setup complete"
    
    complete:
      title: "Logging Setup Complete"
      description: "Sersi has successfully set up the logging channels in this guild."

    custom:
      title: "Custom Logging Setup"
      description: "You can customise the logging channels for this guild. First select a type of log to set up, then select the channel you want to use for that log type. Once you have repeated this process for all log types the Finish Setup button will become available."

    global_logs:
      title: "Global"
      description: "This category contains a duplicate of all specific logs from this guild. E.g. if a user is banned, it will be logged in the global logs as well as the moderation logs."
    public_logs:
      title: "Public"
      description: "This is a public version of the Moderation Logs. This channel contains moderation actions with certain information redacted, such as the Moderator's ID, and specific justifactions. This channel is meant to be used for transparency and to allow users to see moderation actions taken in the guild. If you do not want this channel, you can disable it via the configuration command."
    tamper_logs:
      title: "Tamper"
      description: "This channel is used to log any tampering with server logs. This includes deleting or editing messages in the logs, as well as any other actions that may affect the integrity of the logs. Any tampered logs will be copied here, and an alert will be triggered."
    mod_logs:
      title: "Moderation"
      description: "This channel is used to log all moderation actions taken in the guild. This includes all information about the moderation action."
    guild_logs:
      title: "Guild"
      description: "This channel is used to log all guild-related actions, such as changes to the guild's settings, such as name."
    channel_logs:
      title: "Channel"
      description: "This channel is used to log all channel-related actions, such as creation, deletion, and updates to channels."
    role_logs:
      title: "Role"
      description: "This channel is used to log all role-related actions, such as creation, deletion, and updates to roles."
    join_leave_logs:
      title: "Join Leave"
      description: "This channel is used to log all join and leave actions in the guild. This includes when a user joins or leaves the guild, as well as when a user is kicked or banned."
    voice_logs:
      title: "Voice"
      description: "This channel is used to log all voice-related actions, such as when a user joins or leaves a voice channel, or when a user is muted or unmuted."
    user_logs:
      title: "User"
      description: "This channel is used to log all user-related actions, such as when a user changes their username, avatar, or other profile information."
    deleted_message_logs:
      title: "Deleted Messages"
      description: "This channel is used to log all deleted messages in the guild. This includes when a user deletes their own message, or when a message is deleted by another user or Sersi."
    deleted_image_logs:
      title: "Deleted Images"
      description: "This channel is used to log all deleted images in the guild. This includes when a user deletes their own image, or when an image is deleted by another user or Sersi. Due to Discord's limitations, if an image is not cached by your client, the image will not be visible in the logs."
    edited_message_logs:
      title: "Edited Messages"
      description: "This channel is used to log all edited messages in the guild. This includes when a user edits a message."
    
    buttons:
      tamper_logs: "Tamper Logs"
      global_logs: "Global Logs"
      public_logs: "Public Moderation Logs"
      mod_logs: "Moderation Logs"
      guild_logs: "Guild Logs"
      channel_logs: "Channel Logs"
      role_logs: "Role Logs"
      join_leave_logs: "Join/Leave Logs"
      voice_logs: "Voice Logs"
      user_logs: "User Logs"
      deleted_message_logs: "Deleted Messages Logs"
      deleted_image_logs: "Deleted Images Logs"
      edited_message_logs: "Edited Messages Logs"
      finish_setup: "Finish Setup"

    finish:
      success: "Logging setup has been completed. You can edit the logging channels at any time using the configure command."